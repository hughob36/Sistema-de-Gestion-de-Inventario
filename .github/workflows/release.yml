name: Release Microservices

on:
  push:
    tags:
      - 'v*' # Se dispara solo cuando creas y subes un tag como v1.0.0

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    strategy:
      matrix:
        service: [auth-service, config-server, eureka-service, gateway-service, product-service, stock-service]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Descargamos la imagen ya construida en main o la reconstruimos limpia para el tag
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push tagged image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.service }}:${{ github.ref_name }}

  publish-github-release:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: docker-compose.yaml
          name: "Release Microservicios ${{ github.ref_name }}"
          body: |
            ## 🚀 Release ${{ github.ref_name }}
            Este release incluye las imágenes Docker actualizadas para todos los microservicios en GitHub Packages (`ghcr.io`):
            - `auth-service:${{ github.ref_name }}`
            - `config-server:${{ github.ref_name }}`
            - `eureka-service:${{ github.ref_name }}`
            - `gateway-service:${{ github.ref_name }}`
            - `product-service:${{ github.ref_name }}`
            - `stock-service:${{ github.ref_name }}`

            Puedes utilizar el archivo `docker-compose.yaml` adjunto para levantar todo el ecosistema.
          draft: false
          prerelease: false