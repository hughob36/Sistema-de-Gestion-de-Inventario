server:
  port: 8761
  
spring:
  application:
    name: eureka-service

eureka:
  client:    
    register-with-eureka: false    
    fetch-registry: false
    
  instance:    
    lease-renewal-interval-in-seconds: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}    

