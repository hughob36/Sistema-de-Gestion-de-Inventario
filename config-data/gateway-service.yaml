server:
  port: 443
  
spring:
  cloud:
    gateway:      
      server: 
        webflux:
          discovery:
            locator:
              
              enabled: true 
              
              lower-case-service-id: true 
              
      default-filters:
        - RewritePath: 
            regexp: ^/.*?/(?<remaining>.*)$
            replacement: /${remaining}

springdoc:
  swagger-ui:
    urls:
      - name: auth-service
        url: /api/v1/auth-service/v3/api-docs
      - name: product-service
        url: /api/v1/product-service/v3/api-docs
      - name: stock-service
        url: /api/v1/stock-service/v3/api-docs