server:
  port: 443

spring:
  cloud:
    gateway:
      # CAMBIO AQUÍ: Sintaxis expandida para asegurar el funcionamiento del filtro
      default-filters:
        - name: RewritePath
          args:
            regexp: '^/.*?/(?<remaining>.*)$'
            replacement: '/${remaining}'
      
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

springdoc:
  swagger-ui:
    use-root-path: true
    path: /swagger-ui.html
    urls:
      - name: auth-service
        url: /auth-service/api-docs-json
      - name: product-service
        url: /product-service/api-docs-json
      - name: stock-service
        url: /stock-service/api-docs-json