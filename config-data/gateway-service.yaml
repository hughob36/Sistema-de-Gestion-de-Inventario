server:
  port: 443
  
spring:
  cloud:
    gateway:      
      discovery:
        locator:
          enabled: true 
          lower-case-service-id: true 
      # Eliminé "server: webflux:" que estaba mal indentado arriba, discovery va directo bajo gateway.

springdoc:
  swagger-ui:
    use-root-path: true
    path: /swagger-ui.html
    urls:
      - name: auth-service
        url: /auth-service/v3/api-docs
      - name: product-service
        url: /product-service/v3/api-docs
      - name: stock-service
        url: /stock-service/v3/api-docs