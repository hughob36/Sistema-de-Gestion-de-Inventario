version: '3.8'

services:
  # ==========================================
  # 1. BASES DE DATOS MYSQL
  # ==========================================
  auth-db:
    image: mysql:8.0
    container_name: auth-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: auth_db
    ports:
      - "3307:3306"
    volumes:
      - auth_mysql_data:/var/lib/mysql
    networks:
      - inventory-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  product-db:
    image: mysql:8.0
    container_name: product-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: product_db
    ports:
      - "3308:3306"
    volumes:
      - product_mysql_data:/var/lib/mysql
    networks:
      - inventory-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  stock-db:
    image: mysql:8.0
    container_name: stock-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: stock_db
    ports:
      - "3309:3306"
    volumes:
      - stock_mysql_data:/var/lib/mysql
    networks:
      - inventory-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. INFRAESTRUCTURA (Config Server y Eureka)
  # ==========================================
  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: config-server
    ports:
      - "8081:8081"
    networks:
      - inventory-network
    restart: unless-stopped

  eureka-service:
    build:
      context: ./eureka-service
      dockerfile: Dockerfile
    container_name: eureka-service
    ports:
      - "8761:8761"
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8081
    depends_on:
      - config-server
    networks:
      - inventory-network
    restart: unless-stopped

  # ==========================================
  # 3. MICROSERVICIOS DE NEGOCIO
  # ==========================================
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service   
    environment:
      - BD_URL=jdbc:mysql://auth-db:3306/auth_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - BD_USER=root
      - BD_PASSWORD=${DB_ROOT_PASSWORD}
      - PRIVATE_KEY=${JWT_PRIVATE_KEY}
      - USER_GENERATOR=${JWT_USER_GENERATOR}
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8081
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-service:8761/eureka/
    depends_on:
      auth-db:
        condition: service_healthy
      eureka-service:
        condition: service_started
    networks:
      - inventory-network
    restart: unless-stopped

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product-service    
    environment:
      - BD_URL=jdbc:mysql://product-db:3306/product_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - BD_USER=root
      - BD_PASSWORD=${DB_ROOT_PASSWORD}
      - PRIVATE_KEY=${JWT_PRIVATE_KEY}
      - USER_GENERATOR=${JWT_USER_GENERATOR}
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8081
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-service:8761/eureka/
    depends_on:
      product-db:
        condition: service_healthy
      eureka-service:
        condition: service_started
    networks:
      - inventory-network
    restart: unless-stopped

  stock-service:
    build:
      context: ./stock-service
      dockerfile: Dockerfile
    container_name: stock-service    
    environment:
      - BD_URL=jdbc:mysql://stock-db:3306/stock_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - BD_USER=root
      - BD_PASSWORD=${DB_ROOT_PASSWORD}
      - PRIVATE_KEY=${JWT_PRIVATE_KEY}
      - USER_GENERATOR=${JWT_USER_GENERATOR}
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8081
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-service:8761/eureka/
    depends_on:
      stock-db:
        condition: service_healthy
      eureka-service:
        condition: service_started
    networks:
      - inventory-network
    restart: unless-stopped

  # ==========================================
  # 4. GATEWAY
  # ==========================================
  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    container_name: gateway-service
    ports:
      - "80:443"
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8081
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-service:8761/eureka/
    depends_on:
      - eureka-service
      - auth-service
      - product-service
      - stock-service
    networks:
      - inventory-network
    restart: unless-stopped

volumes:
  auth_mysql_data:
  product_mysql_data:
  stock_mysql_data:

networks:
  inventory-network:
    driver: bridge